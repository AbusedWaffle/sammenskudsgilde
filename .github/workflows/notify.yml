name: Send notifikationer

on:
  schedule:
    # Hvert 15. minut (ikke på hele kvarterer – GitHub er mest belastet dér). GitHub kan forsinke kørsler.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notifier
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: notifier
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: notifier/package-lock.json
      - run: npm ci --omit=dev --no-audit --no-fund
        working-directory: notifier
      - run: node send.js
        working-directory: notifier
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: https://abusedwaffle.github.io/sammenskudsgilde/
          APP_URL: https://abusedwaffle.github.io/sammenskudsgilde/
